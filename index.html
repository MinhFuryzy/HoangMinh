<!-- Widget Nhạc Đang Phát & Nút Bật/Tắt -->
        <div style="margin: 15px auto 5px auto; display: flex; align-items: center; justify-content: center; gap: 10px; background: rgba(0, 0, 0, 0.6); padding: 8px 16px; border-radius: 20px; border: 1px solid rgba(255, 215, 0, 0.3); width: fit-content; position: relative; z-index: 100;">

   <!-- ĐOẠN ĐỌC FILE NHẠC TỰ THÂN TRÊN KHO GIÚP TRÁNH LỖI CHỮ TIẾNG VIỆT -->
    <audio id="bg-music" src="" loop></audio>

  <script {nonce="strict"}>
        document.addEventListener("DOMContentLoaded", function() {
            const musicTag = document.getElementById('bg-music');
            const toggleBtn = document.getElementById('music-toggle-btn');
            const musicIcon = document.getElementById('music-icon');
            musicTag.src = encodeURIComponent("xương rồng (intro).mp3");

            function updateMusicIcon() {
                if (musicTag.paused) {
                    musicIcon.className = 'fas fa-volume-mute';
                    musicIcon.style.color = '#ff4d4d';
                } else {
                    musicIcon.className = 'fas fa-volume-up';
                    musicIcon.style.color = '#fff';
                }
            }

            const playPromise = musicTag.play();
            
            if (playPromise !== undefined) {
                playPromise.then(updateMusicIcon).catch(() => {
                    const startMusic = () => {
                        musicTag.play().then(updateMusicIcon);
                        document.removeEventListener('click', startMusic);
                        document.removeEventListener('touchstart', startMusic);
                        document.removeEventListener('keydown', startMusic);
                    };

                    document.addEventListener('click', startMusic);
                    document.addEventListener('touchstart', startMusic);
                    document.addEventListener('keydown', startMusic);
                });
            }

            if (toggleBtn) {
                toggleBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    if (musicTag.paused) {
                        musicTag.play().then(updateMusicIcon);
                    } else {
                        musicTag.pause();
                        updateMusicIcon();
                    }
                });
            }
        });
    </script>
